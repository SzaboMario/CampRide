# fly.toml – CampRide Blazor Server
app = "campride"
primary_region = "ams"  # Amsterdam (EU)

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # WebSocket szükséges Blazor Serverhez
  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[mounts]]
  source = "campride_data"
  destination = "/data"
  initial_size = "1gb"
